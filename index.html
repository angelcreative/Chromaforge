
<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var access = params.get('access');
          if (access && access.length >= 16) {
            localStorage.setItem('chromaforge_owner_access', access);
            params.delete('access');
            var qs = params.toString();
            history.replaceState({}, document.title, location.pathname + (qs ? '?' + qs : '') + location.hash);
          }
          var theme = localStorage.getItem('chromaforge_theme') || 'system';
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ChromaForge - Advanced Color Token Builder</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link id="apple-touch-icon" rel="apple-touch-icon" href="/favicon-light.svg?v=6" />
    <script>
      (function () {
        var dark = document.documentElement.dataset.theme === 'dark';
        var href = (dark ? '/favicon-dark.svg' : '/favicon-light.svg') + '?v=6';
        var icon = document.getElementById('favicon');
        var apple = document.getElementById('apple-touch-icon');
        if (icon) icon.href = href;
        if (apple) apple.href = href;
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['Geist Mono', 'ui-monospace', 'monospace'],
            },
            colors: {
              background: 'var(--background)',
              foreground: 'var(--foreground)',
              card: { DEFAULT: 'var(--card)', foreground: 'var(--card-foreground)' },
              popover: { DEFAULT: 'var(--popover)', foreground: 'var(--popover-foreground)' },
              primary: { DEFAULT: 'var(--primary)', foreground: 'var(--primary-foreground)' },
              secondary: { DEFAULT: 'var(--secondary)', foreground: 'var(--secondary-foreground)' },
              muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
              accent: { DEFAULT: 'var(--accent)', foreground: 'var(--accent-foreground)' },
              destructive: 'var(--destructive)',
              border: 'var(--border)',
              input: 'var(--input)',
              ring: 'var(--ring)',
              sidebar: 'var(--sidebar)',
              canvas: 'var(--canvas)',
            },
            borderRadius: {
              sm: 'calc(var(--radius) * 0.6)',
              DEFAULT: 'calc(var(--radius) * 0.8)',
              md: 'calc(var(--radius) * 0.8)',
              lg: 'var(--radius)',
              xl: 'calc(var(--radius) * 1.4)',
              '2xl': 'calc(var(--radius) * 1.8)',
              '3xl': 'calc(var(--radius) * 2.2)',
            },
            boxShadow: {
              panel: 'var(--shadow-panel)',
            },
          },
        },
      };
    </script>
    <style>
        @font-face {
            font-family: Geist;
            src: url('/fonts/Geist-Variable.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Geist Mono';
            src: url('/fonts/GeistMono-Variable.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: Geist, ui-sans-serif, system-ui, sans-serif;
            background-color: var(--background);
            color: var(--foreground);
        }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: color-mix(in oklch, var(--foreground) 22%, transparent); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: color-mix(in oklch, var(--foreground) 36%, transparent); }
        .custom-scrollbar-hide::-webkit-scrollbar { display: none; }
        .custom-scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- Glow Card "BORDER & TRANSVERSAL" Effect --- */
        .glow-cards-container:hover .glow-card { background-color: rgba(255, 255, 255, 0.07); }
        .glow-card {
            --mouse-x: 0px; --mouse-y: 0px; --glow-color: rgba(99, 102, 241, 0.5); --glow-opacity: 0;
            position: relative; background-color: rgba(255, 255, 255, 0.04); transition: background-color 500ms;
        }
        .glow-card::before {
            content: ""; position: absolute; inset: -2px;
            border-radius: inherit; z-index: 0; opacity: var(--glow-opacity); transition: opacity 300ms ease-out; pointer-events: none;
            background: transparent;
            border: 2px solid transparent;
            background-clip: padding-box;
            box-shadow: 
                0 0 0 2px transparent,
                inset 0 0 0 2px transparent;
        }
        .glow-card::after {
            content: ""; position: absolute; inset: 1px;
            background-color: var(--card);
            border-radius: calc(1rem - 1px); z-index: 1; pointer-events: none;
        }
        /* Don't apply ::after background for 3D cards that have their own border */
        .glow-card.no-glow-bg::after {
            display: none;
        }
        .glow-content { position: relative; z-index: 3; background: transparent; width: 100%; height: 100%; }

        /* Animations */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }
        @keyframes slide-up-fade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .stagger-entry { animation: slide-up-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        
        /* Gradient Animation */
        @keyframes gradientFade {
            0%, 100% { opacity: 1; }
            33.33% { opacity: 0; }
            66.66% { opacity: 0; }
        }
        .gradient-1 {
            animation: gradientFade 15s ease-in-out infinite;
            animation-delay: 0s;
        }
        .gradient-2 {
            animation: gradientFade 15s ease-in-out infinite;
            animation-delay: 5s;
        }
        .gradient-3 {
            animation: gradientFade 15s ease-in-out infinite;
            animation-delay: 10s;
        }
        
        /* Carousel Timeline Animation */
        @keyframes progress-loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .animate-progress {
            animation-name: progress-loading;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        .cubic-bezier { transition-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* Utility Tooltip */
        .has-tooltip { position: relative; }
        .has-tooltip:hover .tooltip-content { opacity: 1; transform: translate(-50%, -8px); visibility: visible; }
        .tooltip-content {
            opacity: 0; visibility: hidden; position: absolute;
            bottom: 100%; left: 50%; transform: translate(-50%, 0px);
            transition: all 0.2s cubic-bezier(0.165, 0.84, 0.44, 1);
            pointer-events: none; z-index: 50; white-space: nowrap;
        }

        /* Ripple Animation */
        @keyframes ripple-expand {
            0% {
                width: 0px;
                height: 0px;
                opacity: 0.8;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        /* For Tailwind JIT */
        .rotate-270 { transform: rotate(270deg); }
        .perspective { perspective: 1200px; }
        .transform-style-3d { transform-style: preserve-3d; }
    </style>
<link rel="stylesheet" href="/chrome-theme.css">
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
